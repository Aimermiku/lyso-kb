<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>溶酶体离子通道 · 复习知识库</title>
<style>
  :root{
    --bg:#0e1117; --panel:#151a22; --card:#171d26; --line:rgba(255,255,255,.09);
    --txt:#e8ecf3; --dim:#8d97a8; --accent:#7fd1ff;
    --red:#ff8a80; --amber:#ffd479; --green:#8fd6a8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  a{color:var(--accent)}
  header{
    position:sticky; top:0; z-index:20; background:rgba(14,17,23,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:14px 22px 0;
  }
  .head-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  h1{font-size:19px; margin:0; font-weight:600; letter-spacing:.2px}
  .sub{color:var(--dim); font-size:12.5px}
  .modes{display:flex; gap:6px; margin-left:auto}
  .mode{
    border:1px solid var(--line); background:transparent; color:var(--dim);
    padding:6px 13px; border-radius:8px; cursor:pointer; font-size:13.5px;
  }
  .mode:hover{color:var(--txt); border-color:rgba(255,255,255,.2)}
  .mode.on{background:rgba(127,209,255,.14); color:var(--accent); border-color:rgba(127,209,255,.4)}
  .tools{display:flex; gap:10px; align-items:center; padding:12px 0; flex-wrap:wrap}
  input[type=search], input[type=text], textarea, select{
    background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; padding:8px 11px; font:inherit; font-size:14px; outline:none;
  }
  input[type=search]{width:280px}
  input[type=search]:focus, input[type=text]:focus, textarea:focus{border-color:rgba(127,209,255,.45)}
  .chips{display:flex; gap:6px; flex-wrap:wrap}
  .chip{
    border:1px solid var(--line); border-radius:20px; padding:3px 11px;
    font-size:12.5px; color:var(--dim); cursor:pointer; background:transparent;
  }
  .chip.on{color:var(--accent); border-color:rgba(127,209,255,.45); background:rgba(127,209,255,.1)}
  main{padding:20px 22px 80px; max-width:1280px; margin:0 auto}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:15px 16px 13px; display:flex; flex-direction:column; gap:8px;
  }
  .card-top{display:flex; align-items:flex-start; gap:8px}
  .term{font-size:15.5px; font-weight:600; line-height:1.4}
  .badge{
    font-size:11px; padding:1px 7px; border-radius:5px; color:var(--dim);
    border:1px solid var(--line); white-space:nowrap; margin-left:auto;
  }
  .short{color:#cfd6e2; font-size:13.8px}
  .detail{color:var(--dim); font-size:13px; display:none; border-top:1px dashed var(--line); padding-top:8px; margin-top:2px}
  .card.open .detail{display:block}
  .card-foot{display:flex; align-items:center; gap:10px; margin-top:auto; font-size:11.5px; color:#6f7888}
  .src{margin-left:auto}
  .toggle{background:none; border:none; color:var(--dim); cursor:pointer; font-size:12px; padding:0}
  .toggle:hover{color:var(--accent)}
  .del{background:none; border:none; color:#7b5b5b; cursor:pointer; font-size:12px; padding:0}
  .del:hover{color:var(--red)}

  /* review */
  .review-wrap{max-width:780px; margin:0 auto}
  .progress{color:var(--dim); font-size:12.5px; display:flex; justify-content:space-between; margin-bottom:12px}
  .flash{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:30px 30px 26px; min-height:280px; display:flex; flex-direction:column; gap:16px;
  }
  .flash .q{font-size:22px; font-weight:600; line-height:1.45}
  .flash .q small{display:block; font-size:12.5px; color:var(--dim); font-weight:400; margin-top:8px}
  .flash .a{border-top:1px solid var(--line); padding-top:16px; display:none}
  .flash.revealed .a{display:block}
  .flash .a p{margin:0 0 10px; font-size:14.5px}
  .flash .a .dd{color:var(--dim); font-size:13.2px}
  .flash .a .pp{color:#6f7888; font-size:11.5px}
  .acts{display:flex; gap:10px; flex-wrap:wrap}
  .btn{border:1px solid var(--line); background:var(--panel); color:var(--txt);
    padding:9px 18px; border-radius:9px; cursor:pointer; font:inherit; font-size:14px}
  .btn:hover{border-color:rgba(255,255,255,.25)}
  .btn.primary{background:rgba(127,209,255,.16); border-color:rgba(127,209,255,.45); color:var(--accent)}
  .btn.g1{border-color:rgba(255,138,128,.4); color:var(--red)}
  .btn.g2{border-color:rgba(255,212,121,.4); color:var(--amber)}
  .btn.g3{border-color:rgba(143,214,168,.4); color:var(--green)}
  .hintline{color:#6f7888; font-size:12px; margin-top:12px}

  /* add form */
  .form{max-width:720px; display:grid; gap:12px}
  .form label{font-size:12.5px; color:var(--dim); display:block; margin-bottom:5px}
  .form textarea{min-height:92px; resize:vertical; width:100%}
  .form input[type=text]{width:100%}
  .form .row2{display:grid; grid-template-columns:1fr 200px; gap:12px}

  /* data */
  .data{max-width:720px; display:grid; gap:16px}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px}
  .panel h3{margin:0 0 6px; font-size:15px}
  .panel p{margin:0 0 12px; color:var(--dim); font-size:13px}
  .stats{display:flex; gap:26px; flex-wrap:wrap}
  .stat b{display:block; font-size:22px; color:var(--accent)}
  .stat span{font-size:12px; color:var(--dim)}
  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:rgba(127,209,255,.16); border:1px solid rgba(127,209,255,.4); color:var(--accent);
    padding:8px 16px; border-radius:9px; font-size:13px; opacity:0; transition:.25s; pointer-events:none}
  .toast.on{opacity:1}
  .empty{color:var(--dim); text-align:center; padding:60px 0}
  @media(max-width:640px){
    input[type=search]{width:100%}
    .modes{width:100%; margin-left:0}
    main{padding:16px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div>
      <h1>溶酶体离子通道 · 复习知识库</h1>
      <div class="sub">内置两篇：Li, Gu &amp; Xu, <i>TiBS</i> 2019 + Hu, Li 等, <i>Cell</i> 2022 的 63 张卡片（含术语与 2022 修正）· 可继续添加自己的主题 · 本地存储，离线可用</div>
    </div>
    <div class="modes">
      <button class="mode on" data-mode="browse">浏览</button>
      <button class="mode" data-mode="review">复习</button>
      <button class="mode" data-mode="add">新增</button>
      <button class="mode" data-mode="data">数据</button>
    </div>
  </div>
  <div class="tools" id="tools">
    <input type="search" id="q" placeholder="搜索术语、释义、细节或标签…">
    <div class="chips" id="chips"></div>
    <div class="sub" id="count" style="margin-left:auto"></div>
  </div>
</header>
<main>
  <div id="view"></div>
</main>
<div class="toast" id="toast"></div>

<script>
const KEY='lyso_kb_v1';
const IV=[1,2,4,7,15];              // 复习间隔（天），按掌握层级
const CATS=['图形','通道','信号','疾病','方法','概念','术语','修正'];

/* ---------- 种子卡片 ---------- */
const SEED=[
/* 图形 */
{c:'图形',t:'图1｜溶酶体功能全景',s:'一张图说清"降解站+信号枢纽"。',
 d:'读法：中间紫色大圆是溶酶体降解中心；左侧四条输入（内吞成熟、自噬、线粒体自噬、细胞器物质交换）；黑点分解产物经 exporter、囊泡运输、胞吐或膜接触位点排出；右上是质膜修复与溶酶体膜自我修复。下半部是调控：营养充足时 mTOR 在溶酶体表面激活 S6K，饥饿时 mTOR 离开、TFEB 去磷酸化进核启动溶酶体生成。全图黄点 Ca²⁺ 是贯穿的调度信号。',
 p:'p111',g:['总览','mTOR','TFEB','胞吐']},
{c:'图形',t:'图2｜单个溶酶体的离子与通道',s:'腔内高 Ca 高 Na 低 K，膜上泵阀成对出现。',
 d:'腔内：Ca 0.5 mM、Na 100±20 mM、K 10±5 mM、H 25 μM（pH 4.6）、Cl 60 mM、ΔΨ≈0±20 mV。胞质：K 150 mM、Na 12 mM、Ca 100 nM、H 40 nM、Cl 25±15 mM。膜上：V-ATPase 泵 H⁺，TRPMLs 出 Ca/Na，TPCs 出 Na，P2X4 由腔内 ATP 打开，TMEM175 与 BK 走 K，SLC38A9 感受精氨酸，NPC1 转胆固醇；LysoH 与 LysoCl 是尚未鉴定分子身份的漏电导。',
 p:'p113',g:['离子梯度','V-ATPase','TRPML','TPC']},
{c:'图形',t:'图3｜膜电位怎样被改写',s:'ΔΨ 平时贴着 0，刺激时出现 ±50 mV 尖峰。',
 d:'上半部三条记录：Na⁺ 或 H⁺ 通道打开→正向尖峰（去极化约 +50 mV）；K⁺ 通道打开→负向尖峰（超极化约 −50 mV）。尖峰冲上去很快回落，不是持久台阶。中部两张膜图把这个逻辑画实：去极化靠 Na/H，超极化靠 K，且超极化会加大 Ca²⁺ 释放驱动力（BK 正反馈的基础）。下半部 B 比较大小溶酶体：大者峰更高更久，因为腔内离子被抽稀得慢。',
 p:'p115',g:['膜电位','去极化','超极化','尺寸']},
{c:'图形',t:'图4｜结构解释门控',s:'两种激动剂从不同口袋开同一扇门。',
 d:'A：TRPML1 四聚体俯视，绿点=ML-SA1 结合位点（S5–S6 上方疏水口袋），红/橙=PI(3,5)P₂ 结合位点（N 端 S1–S3 附近）；卡通显示两条独立开门路径：ML-SA1 直接开，PI(3,5)P₂ 经 S2–S3 linker 拉动 S6 门。B：TPC2 二聚体，PI(3,5)P₂ 结合在 S4–S5 linker 与 S6，结合后 IS5–IS6 内螺旋张开。结论：同一通道可被多个信号从不同位点激活，必须用位点特异性突变才能分离功能。',
 p:'p118',g:['结构','ML-SA1','PI(3,5)P2','门控']},

/* 通道 */
{c:'通道',t:'TRPML1–3',s:'粘脂素型 TRP 通道，溶酶体主 Ca²⁺ 出口。',
 d:'六次跨膜四聚体，由双亮氨酸基序定位到晚期内体/溶酶体。TRPML1 全身表达、研究最透；TRPML2/3 表达受限。可通透 Ca²⁺、Na⁺、K⁺ 及 Fe²⁺/Zn²⁺。TRPML1 缺失导致 IV 型黏脂贮积症。激动剂：PI(3,5)P₂、ROS；抑制剂：PI(4,5)P₂、鞘磷脂、腺苷、mTOR 磷酸化。',
 p:'p117',g:['Ca通道','ML-IV','定位']},
{c:'通道',t:'TPC1 / TPC2',s:'双孔通道，本文定性为 Na⁺ 选择性、主要改写 ΔΨ。',
 d:'二聚体 12 次跨膜，经双亮氨酸基序定位。PNa/PCa>10、PNa/PK>60，PI(3,5)P₂ 门控，受胞质 ATP/mTOR 调制。功能：氨基酸外排、腔内 pH 稳态、自噬调控、内体—ER 膜接触。争议点：领域内长期认为它是 NAADP 依赖的 Ca²⁺ 释放通道，本文明确否认，且关键否定证据未发表。',
 p:'p119–120',g:['Na通道','膜电位','争议']},
{c:'通道',t:'P2X4',s:'腔内 ATP 打开、酸性 pH 抑制的阳离子通道。',
 d:'三聚体两次跨膜，同时定位在溶酶体与质膜，靠双亮氨酸+酪氨酸基序定位。由腔内 ATP 激活，被酸性 pH 抑制；激活后经钙调蛋白驱动同型溶酶体融合。悖论：它的工作环境 pH 4.6，长期处于被抑制状态，生理贡献可能远小于体外所见。',
 p:'p120',g:['ATP','融合','悖论']},
{c:'通道',t:'TMEM175',s:'离子的"身份"随 pH 变：pH>7 时是 K⁺ 通道，pH 4.6 时是质子通道（2022 修正）。',
 d:'二聚体 12 次跨膜，用 FSD 而非 GYG 基序。2015 年结论（pH>7 条件下）：K⁺ 选择性、PK/PNa>30、组成性背景电导、维持静息 ΔΨ、电流很小多数溶酶体测不到。2022 年同一实验室修正：生理 pH 4.5–5.0 下改为质子选择性（PH/PK≈4.8×10⁴，>90% 电流由 H⁺ 承载），被腔侧质子门控、基础活性极低；缺失导致溶酶体过酸化而非碱化，K⁺ 反离子模型不成立。GWAS 将其与帕金森病关联。',
 p:'p121；Cell 2022 p2293–2304',g:['K通道','质子通道','帕金森','2022修正']},
{c:'通道',t:'BK / LysoKVCa',s:'大电导钙激活钾通道，Ca²⁺ 释放的正反馈放大器。',
 d:'四聚体，电压与 Ca²⁺ 双重激活。溶酶体上的版本称 LysoKVCa，单个通道开放即可显著改变 ΔΨ。机制：超极化→增大 Ca²⁺ 释放驱动力→更多 Ca²⁺→通道更开（正反馈）；并参与 Ca²⁺ 库再充盈。BK 激动剂在多种 LSD 成纤维细胞中减少贮积。',
 p:'p121',g:['K通道','正反馈','再充盈']},
{c:'通道',t:'V-ATPase',s:'质子泵，把溶酶体酸化成 pH 4.6。',
 d:'多亚基旋转泵，在内体成熟过程中逐步酸化至平台值 pHL 4.6。它也参与 mTORC1 感知腔内氨基酸（"由内而外"机制）。酸化需要 Cl⁻ 等阴离子作反离子。',
 p:'p113',g:['酸化','pH','mTOR']},

/* 信号 */
{c:'信号',t:'PI(3,5)P₂',s:'晚期内体/溶酶体专属脂质，天然"地址码"。',
 d:'由 PIKfyve 合成、OCRL 等去磷酸化。它直接结合 TRPML 与 TPC 的胞质侧正电荷残基打开通道，结合位点已由高分辨率结构确证。抑制其合成会造成类似 ML-IV 的运输缺陷。关键细节：氨基酸饥饿时其水平显著下降。',
 p:'p117',g:['脂质','地址码','TRPML','TPC']},
{c:'信号',t:'PI(4,5)P₂',s:'TRPML1 的抑制剂，也在溶酶体上参与再形成。',
 d:'主要位于质膜，本文指出它在溶酶体膜上生成并调控 mTOR 依赖的溶酶体再形成，同时抑制 TRPML1——同一脂质既是"再形成"的信号又是 Ca²⁺ 通道的刹车。某些 LSD 细胞中其水平异常升高。',
 p:'p119',g:['脂质','抑制','再形成']},
{c:'信号',t:'ROS → TRPML1 → TFEB',s:'一条可验证的信号链。',
 d:'线粒体损伤产生 ROS，ROS 直接激活 TRPML1，Ca²⁺ 释放促使 TFEB 去磷酸化进核，启动自噬体与溶酶体生成，形成清除受损线粒体的负反馈。ROS 敏感性是否为生理主通路，仍需位点特异性 knock-in 验证。',
 p:'p117',g:['ROS','TFEB','自噬']},
{c:'信号',t:'mTORC1 与营养感知',s:'溶酶体是营养感知的物理平台。',
 d:'mTORC1 锚在溶酶体膜，与 Rag/Rheb、V-ATPase、SLC38A9 组成复合物，同时感知腔内与胞质氨基酸池。饥饿时解离，蛋白合成停、自噬升；同时 mTOR 可磷酸化抑制 TRPML1，也可调制 TPC2。',
 p:'p112、p117',g:['营养','mTOR','自噬']},
{c:'信号',t:'TFEB',s:'溶酶体生成的"总开关"转录因子。',
 d:'磷酸化状态留在胞质，去磷酸化后进核，启动溶酶体生物发生相关基因。被 Ca²⁺（经钙调磷酸酶）与 ROS 通路激活，是溶酶体适应与清除能力的转录层保障。',
 p:'p112',g:['转录','生物发生','Ca']},
{c:'信号',t:'NAADP 争议',s:'曾被当作溶酶体 Ca²⁺ 信使，本文否认。',
 d:'早期认为 NAADP 经 TPC 触发内体/溶酶体 Ca²⁺ 释放。本文立场：TPC 是 PI(3,5)P₂ 激活的 Na⁺ 通道，NAADP 不是直接激动剂；标志性证据是 Ned-19 几乎不阻断全溶酶体 TPC 电流，以及鞘氨醇在直接记录中未能激活 TPC——但这两条依赖"X. Zhang and H. Xu, unpublished"。',
 p:'p119–120',g:['NAADP','争议','未发表']},
{c:'信号',t:'ΔΨ（溶酶体膜电位）',s:'由 H⁺/Na⁺/K⁺ 相对通透性决定的电位差。',
 d:'定义：ΔΨ = 胞质电位 − 腔电位。静息时因通道几乎未被环境信号激活，围绕 0 mV 波动（±20 mV）；刺激时随通道开放瞬时摆到 ±50 mV。文献实测值分散：吞噬溶酶体 −19 mV，vacuolin 放大溶酶体 +20 mV。作者主张生理真值在 0 附近。',
 p:'p114–115',g:['膜电位','静息','测量']},

/* 概念 */
{c:'概念',t:'解码器框架',s:'通道=把细胞信号翻译成两种输出。',
 d:'输入（PI(3,5)P₂、ROS、pH、ATP、营养状态）→ 通道（选择性+脂质门控+pH 门控）→ 输出（化学：腔内 Ca²⁺ 释放；电学：ΔΨ 变化）→ 功能（运输、外排、修复、TFEB、融合）。框架的解释力在于把"通道很多、功能很多"的罗列变成有分工的回路。',
 p:'p110、p115',g:['框架','核心']},
{c:'概念',t:'双输出分工',s:'Ca²⁺ 管触发，ΔΨ 管驱动力与门控。',
 d:'Ca²⁺ 输出幅度型、由库存限制；ΔΨ 输出门控型、由表面电荷决定。两者时间尺度不同：电位改变只需要约 10³ 个电荷（亚毫秒），体相浓度改变需要 10⁵ 量级离子。混为一谈会削弱论证精确性，但不影响"静息≈0 mV"的大方向。',
 p:'p114–115、我的分析',g:['框架','定量']},
{c:'概念',t:'地址码（位置特异性）',s:'信号的"在哪发出"由器官专属脂质+局部 pH 编码。',
 d:'PI(3,5)P₂ 只在晚期内体/溶酶体上富集，通道对它的依赖等于把定位写进门控逻辑；再叠加腔内酸性 pH 的门控，位置特异性比分子特异性更可靠。做合成生物学信号回路时，这是比"专用配体"更鲁棒的策略。',
 p:'p117、p119、我的推断',g:['框架','工程']},
{c:'概念',t:'离子库存与通量估算',s:'作者用物理约束给 ΔΨ 划定取值区间。',

/* ---------- 状态 ---------- */
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY));
    if(raw && typeof raw==='object') return {custom:raw.custom||[], prog:raw.prog||{}};
  }catch(e){}
  return {custom:[], prog:{}};
}
let S=load();
let mode='browse', cat='全部', kw='', queue=[], qi=0, revealed=false;

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function all(){ return SEED.concat(S.custom); }
function P(id){ return S.prog[id]||{box:0,due:null,n:0}; }
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function dayStr(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function idOf(c){ return c.t; }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1800);
}

/* ---------- 渲染 ---------- */
const view=document.getElementById('view');
const chips=document.getElementById('chips');
const qEl=document.getElementById('q');

function renderChips(){
  const cs=['全部'].concat(Array.from(new Set(all().map(c=>c.c||'未分类'))));
  chips.innerHTML=cs.map(c=>
    '<button class="chip'+(c===cat?' on':'')+'" data-cat="'+c+'">'+c+'</button>'
  ).join('');
}
function matches(c){
  if(cat!=='全部' && c.c!==cat) return false;
  if(!kw) return true;
  const hay=(c.t+' '+c.s+' '+(c.d||'')+' '+(c.g||[]).join(' ')+' '+(c.p||'')).toLowerCase();
  return hay.indexOf(kw)>=0;
}
function renderBrowse(){
  const list=all().filter(matches);
  document.getElementById('count').textContent='共 '+all().length+' 张 · 显示 '+list.length;
  if(!list.length){ view.innerHTML='<div class="empty">没有匹配的卡片，换个词试试。</div>'; return; }
  view.innerHTML='<div class="grid">'+list.map(c=>{
    const p=P(idOf(c)), box=p.box;
    return '<div class="card" data-id="'+esc(idOf(c))+'">'
      +'<div class="card-top"><div class="term">'+esc(c.t)+'</div><span class="badge">'+esc(c.c)+'</span></div>'
      +'<div class="short">'+esc(c.s)+'</div>'
      +'<div class="detail">'+esc(c.d||'')+'</div>'
      +'<div class="card-foot">'
        +'<button class="toggle">展开</button>'
        +'<span class="lv">'+(box?('已复习 '+box+' 级'):'未复习')+'</span>'
        +(S.custom.some(x=>x.t===c.t)?'<button class="del">删除</button>':'')
        +'<span class="src">'+esc(c.p||'')+'</span>'
      +'</div></div>';
  }).join('')+'</div>';
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- 复习 ---------- */
function buildQueue(){
  const t=today();
  let list=all().filter(c=>{
    const p=P(idOf(c));
    if(!p.due) return true;
    return Date.parse(p.due)<=t;
  });
  list.sort((a,b)=>{
    const pa=P(idOf(a)), pb=P(idOf(b));
    if(pa.box!==pb.box) return pa.box-pb.box;
    return (Date.parse(pa.due||'1970-01-01')||0)-(Date.parse(pb.due||'1970-01-01')||0);
  });
  queue=list; qi=0; revealed=false;
  if(!queue.length) return;
  if(queue.length>25) queue=queue.slice(0,25);
}
function renderReview(){
  if(!queue.length && qi===0){ buildQueue(); }
  document.getElementById('count').textContent='待复习 '+queue.length+' 张';
  if(!queue.length){
    view.innerHTML='<div class="review-wrap"><div class="flash"><div class="q">今天的卡片都复习完了</div>'
      +'<div class="a" style="display:block"><p>可以去「浏览」里继续看，或去「新增」补充自己的卡片。</p>'
      +'<p class="dd">下次到期的卡片会自动出现在这里。</p></div></div></div>';
    return;
  }
  const c=queue[qi], p=P(idOf(c));
  view.innerHTML='<div class="review-wrap">'
    +'<div class="progress"><span>'+(qi+1)+' / '+queue.length+'</span><span>'+esc(c.c)+' · '+esc(c.p||'')+'</span></div>'
    +'<div class="flash'+(revealed?' revealed':'')+'" id="flash">'
      +'<div class="q">'+esc(c.t)+'<small>先自己回忆：它是什么？做什么用？</small></div>'
      +'<div class="a">'
        +'<p>'+esc(c.s)+'</p>'
        +'<p class="dd">'+esc(c.d||'')+'</p>'
        +'<p class="pp">'+esc((c.g||[]).join(' · '))+'</p>'
      +'</div>'
      +(revealed
        ? '<div class="acts"><button class="btn g1" data-g="1">忘记了 (1)</button>'
          +'<button class="btn g2" data-g="2">模糊 (2)</button>'
          +'<button class="btn g3" data-g="3">记得 (3)</button></div>'
        : '<div class="acts"><button class="btn primary" id="showBtn">显示答案（空格）</button></div>')
      +'</div>'
    +'<div class="hintline">间隔规则：忘记=1 天，模糊=保持当前层级，记得=升一级（1/2/4/7/15 天）</div>'
  +'</div>';
}

function grade(g){
  const c=queue[qi]; if(!c) return;
  const id=idOf(c); const p=P(id); p.n=(p.n||0)+1;
  if(g===3) p.box=Math.min(5,p.box+1);
  else if(g===2) p.box=Math.max(1,p.box);
  else p.box=1;
  const days=IV[p.box-1]||1;
  p.due=dayStr(today()+days*86400000);
  S.prog[id]=p; save();
  revealed=false; qi++;
  if(qi>=queue.length){ queue=[]; qi=0; renderReview(); toast('本轮复习完成，已记录排期'); }
  else renderReview();
}

/* ---------- 新增 ---------- */
function renderAdd(){
  document.getElementById('count').textContent='';
  view.innerHTML='<div class="form">'
    +'<div><label>术语 / 问题（复习时作为正面）</label><input type="text" id="f-t" placeholder="例如：LysoKVCa 的正反馈"></div>'
    +'<div><label>一句话释义（复习时作为第一层答案）</label><input type="text" id="f-s" placeholder="例如：超极化→增大 Ca²⁺ 驱动力→更多 Ca²⁺→通道更开"></div>'
    +'<div class="row2"><div><label>分类（可自定义）</label><input type="text" id="f-c" list="catList" value="概念">'
    +'<datalist id="catList">'+Array.from(new Set(all().map(c=>c.c||'未分类'))).map(c=>'<option>'+esc(c)+'</option>').join('')+'</datalist></div>'
    +'<div><label>来源 / 页码</label><input type="text" id="f-p" placeholder="p121 或 我的笔记"></div></div>'
    +'<div><label>细节（可选，第二层答案）</label><textarea id="f-d" placeholder="机制、条件、易混点、反例…"></textarea></div>'
    +'<div><label>标签（逗号分隔，可选）</label><input type="text" id="f-g" placeholder="K通道, 正反馈"></div>'
    +'<div class="acts"><button class="btn primary" id="saveCard">保存卡片</button></div>'
    +'<div class="hintline">卡片保存在本机浏览器里，换设备或清理浏览器数据前请到「数据」导出备份。</div>'
    +'</div>';
}

/* ---------- 数据 ---------- */
function renderData(){
  const tot=all().length, cust=S.custom.length;
  const due=all().filter(c=>!P(idOf(c)).due||Date.parse(P(idOf(c)).due)<=today()).length;
  const mast=all().filter(c=>P(idOf(c)).box>=4).length;
  document.getElementById('count').textContent='';
  view.innerHTML='<div class="data">'
    +'<div class="panel"><div class="stats">'
      +'<div class="stat"><b>'+tot+'</b><span>卡片总数</span></div>'
      +'<div class="stat"><b>'+cust+'</b><span>自己新增</span></div>'
      +'<div class="stat"><b>'+due+'</b><span>今日待复习</span></div>'
      +'<div class="stat"><b>'+mast+'</b><span>已掌握（4 级以上）</span></div>'
    +'</div></div>'
    +'<div class="panel"><h3>导出备份</h3><p>下载一个 JSON 文件，包含你自己新增的卡片与全部复习进度。</p>'
      +'<button class="btn" id="expBtn">导出 JSON</button></div>'
    +'<div class="panel"><h3>导入 / 恢复</h3><p>选择之前导出的 JSON；自己新增的卡片会与进度合并，内置卡片不变。</p>'
      +'<input type="file" id="impFile" accept="application/json,.json"></div>'
    +'<div class="panel"><h3>重置</h3><p>只清空复习进度，不动卡片。</p>'
      +'<button class="btn" id="resetBtn">重置复习进度</button></div>'
    +'</div>';
}

function render(){
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  document.getElementById('tools').style.display = (mode==='browse')?'flex':'none';
  if(mode==='browse'){ renderChips(); renderBrowse(); }
  else if(mode==='review'){ renderReview(); }
  else if(mode==='add'){ renderAdd(); }
  else { renderData(); }
}

/* ---------- 事件 ---------- */
document.querySelectorAll('.mode').forEach(b=>{
  b.onclick=()=>{ mode=b.dataset.mode; if(mode==='review'){ queue=[]; qi=0; revealed=false; } render(); };
});
chips.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  cat=b.dataset.cat; renderChips(); renderBrowse();
});
qEl.addEventListener('input',()=>{ kw=qEl.value.trim().toLowerCase(); renderBrowse(); });

view.addEventListener('click',e=>{
  const card=e.target.closest('.card');
  if(card){
    if(e.target.closest('.toggle')){
      card.classList.toggle('open');
      e.target.closest('.toggle').textContent=card.classList.contains('open')?'收起':'展开';
      return;
    }
    if(e.target.closest('.del')){
      const id=card.dataset.id;
      if(confirm('删除这张自己新增的卡片？')){
        S.custom=S.custom.filter(x=>x.t!==id); delete S.prog[id]; save(); renderBrowse(); toast('已删除');
      }
      return;
    }
    card.classList.toggle('open');
    const t=card.querySelector('.toggle');
    if(t) t.textContent=card.classList.contains('open')?'收起':'展开';
    return;
  }
  if(e.target.id==='showBtn'){ revealed=true; renderReview(); return; }
  const g=e.target.closest('[data-g]');
  if(g){ grade(Number(g.dataset.g)); return; }
  if(e.target.id==='saveCard'){
    const t=document.getElementById('f-t').value.trim();
    const s=document.getElementById('f-s').value.trim();
    if(!t||!s){ toast('术语和释义都要填'); return; }
    if(all().some(x=>x.t===t)){ toast('已有同名卡片'); return; }
    S.custom.push({
      c:document.getElementById('f-c').value,
      t:t, s:s,
      d:document.getElementById('f-d').value.trim(),
      p:document.getElementById('f-p').value.trim(),
      g:document.getElementById('f-g').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean)
    });
    save(); toast('已保存'); mode='browse'; render();
    return;
  }
  if(e.target.id==='expBtn'){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='lyso-kb-'+dayStr(Date.now())+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('已导出');
    return;
  }
  if(e.target.id==='resetBtn'){
    if(confirm('清空全部复习进度？卡片不会删除。')){ S.prog={}; save(); render(); toast('进度已重置'); }
    return;
  }
});
view.addEventListener('change',e=>{
  if(e.target.id!=='impFile') return;
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.custom && Array.isArray(d.custom)){
        const have=S.custom.map(x=>x.t);
        d.custom.forEach(c=>{ if(!have.includes(c.t)) S.custom.push(c); });
      }
      if(d.prog && typeof d.prog==='object') Object.assign(S.prog,d.prog);
      save(); render(); toast('已导入');
    }catch(err){ toast('文件格式不对'); }
  };
  r.readAsText(f,'utf-8');
});

document.addEventListener('keydown',e=>{
  if(mode!=='review') return;
  if(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); if(!revealed){ revealed=true; renderReview(); } return; }
  if(revealed && ['1','2','3'].includes(e.key)){ grade(Number(e.key)); }
});

render();
</script>
</body>
</html>
